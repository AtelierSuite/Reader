<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!--
    A piece of content set on the blossom: its title, a shorter byline, and a
    hero image, inset evenly from the petals around it. The lines share
    Libretto's weight. Drawn in white; the layer is filled solid white in dark
    mode, where Icon Composer would otherwise tint it into the blossom behind it.
  -->
  <g fill="#FFFFFF">
    <rect x="350" y="400" width="324" height="28" rx="14"/>
    <rect x="350" y="458" width="206" height="28" rx="14" opacity="0.8"/>
    <rect x="350" y="524" width="324" height="140" rx="28" opacity="0.72"/>
  </g>
</svg>
